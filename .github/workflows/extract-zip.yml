name: Extract Hardware ZIP

on:
  push:
    paths:
      - "wevibed-hardware*.zip"
      - ".github/workflows/extract-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract hardware website
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "wevibed-hardware*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Hardware ZIP not found."
            exit 1
          fi

          mkdir -p /tmp/hardware-site
          unzip -o "$ZIP_FILE" -d /tmp/hardware-site

          SOURCE="/tmp/hardware-site"
          COUNT=$(find "$SOURCE" -mindepth 1 \
            -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ] && \
             [ -d "$(find "$SOURCE" -mindepth 1 \
             -maxdepth 1)" ]; then
            SOURCE=$(find "$SOURCE" -mindepth 1 \
              -maxdepth 1)
          fi

          cp -a "$SOURCE"/. .

          if [ ! -f package.json ] && \
             [ ! -f index.html ]; then
            echo "ERROR: Website files not found."
            find . -maxdepth 3 \
              \( -name package.json -o -name index.html \)
            exit 1
          fi

          echo "Hardware website extracted successfully."

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/workflows/

          if ! git diff --cached --quiet; then
            git commit -m "Extract hardware website files"
            git push origin HEAD:main
          else
            echo "No new files to commit."
          
